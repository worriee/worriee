<!--
TERMINAL LAYOUT RULE (row rhythm = 23px):
- REMOVE row: delete block, every y below it -23, palette y -23, card height -23
- ADD row: every y at/after slot +23, palette y +23, card height +23
- Palette y = last row + 32 | Card height = palette y + 45 (18 bar + 27 pad)
- Height lives in 3 spots: height attr, viewBox, background <rect>
- Spacing = positions only. NEVER touch CSS/animation for gaps.
-->

