.out{opacity:0;animation:show .4s ease 1.9s forwards}
.ch{opacity:0;animation:show .01s linear forwards}
.cur{animation:follow .96s linear .30s forwards, hide .01s linear 2.3s forwards}
@keyframes show{to{opacity:1}}
@keyframes follow{0%{transform:translateX(0)}1%,12.5%{transform:translateX(9px)}13.5%,25%{transform:translateX(18px)}26%,37.5%{transform:translateX(27px)}38.5%,50%{transform:translateX(36px)}51%,62.5%{transform:translateX(45px)}63.5%,75%{transform:translateX(54px)}76%,87.5%{transform:translateX(63px)}88%,93.5%{transform:translateX(72px)}94.5%,100%{transform:translateX(81px)}}
@keyframes hide{to{opacity:0}}
</style>
